<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin login</title>
  <style>
    :root { --color-primary: #7c3aed; --color-primary-dark: #5b21b6; --color-border: #e4dff5; --color-text: #241c33; --color-muted: #837a95; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f7f5fb; color: var(--color-text);
    }
    form {
      background: #fff; border: 1px solid var(--color-border); border-radius: 18px;
      padding: 32px 28px; width: 100%; max-width: 340px;
      box-shadow: 0 20px 50px rgba(124, 58, 237, 0.12);
    }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p.hint { color: var(--color-muted); font-size: 13px; margin: 0 0 20px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--color-muted); margin: 14px 0 6px; }
    input {
      width: 100%; border: 1px solid var(--color-border); border-radius: 10px;
      padding: 10px 12px; font-size: 14px; font-family: inherit;
    }
    button {
      width: 100%; margin-top: 20px; background: var(--color-primary); color: #fff;
      border: none; border-radius: 999px; padding: 12px; font-size: 14px; font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: var(--color-primary-dark); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #status { min-height: 18px; font-size: 13px; margin-top: 10px; color: #dc2626; }
  </style>
</head>
<body>
  <form id="loginForm">
    <h1>Admin panel</h1>
    <p class="hint">Sign in to edit your templates.</p>
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" required />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <button id="submitBtn" type="submit">Sign in</button>
    <div id="status"></div>
  </form>

  <script>
    const form = document.getElementById('loginForm');
    const statusEl = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      statusEl.textContent = '';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        const out = await res.json();
        if (!res.ok) throw new Error(out.error || 'login failed');
        location.href = '/admin.html';
      } catch (err) {
        statusEl.textContent = err.message;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
