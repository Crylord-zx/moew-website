<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="/logo.png" />

  <title>Meow Webpages</title>
  <meta name="description"
    content="Create personalized romantic pages for birthdays, anniversaries, Valentine's Day, and every moment that deserves to be celebrated with love." />

  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600&display=swap" rel="stylesheet" />
  <script>
    // These templates' own "Back" buttons are internal react-router Links
    // (to this source app's own "/" or "/template/<category>") or call
    // window.history.back() — either way they stay inside this app instead
    // of returning to Meow Webpages. Intercept the click before react-router
    // sees it and force a real navigation to our own home page.
    // Inside the customize form's live-preview iframe, there's no "our own
    // home page" to send it to — that would just replace the tiny preview
    // with the full gallery. There, back/exit should simply do nothing.
    var inPreviewFrame = window.self !== window.top;
    function goBack() {
      if (inPreviewFrame) return;
      window.location.href = '/';
    }
    document.addEventListener('click', function (e) {
      var el = e.target.closest('a, button');
      if (!el) return;
      var text = (el.textContent || '').trim().toLowerCase();
      var anchor = el.tagName === 'A' ? el : el.closest('a');
      var href = anchor ? (anchor.getAttribute('href') || '') : '';
      var isInternalNavLink = /^\/($|template(\/|$))/.test(href);
      if (text === 'back' || isInternalNavLink) {
        e.preventDefault();
        e.stopImmediatePropagation();
        goBack();
      }
    }, true);
    window.history.back = goBack;

    // Deep-merges a visitor's saved customization onto a template's real
    // default data. Used by the patched bundle at each template's
    // defaultData site, instead of a full replace, so fields the visitor
    // never touched (including ones we can't safely serialize, like an
    // icon component reference) keep working exactly as before.
    window.__meowMerge = function (base, override) {
      if (!override) return base;
      if (Array.isArray(override)) return override;
      if (typeof override !== 'object' || typeof base !== 'object' || base === null) return override;
      var out = Object.assign({}, base);
      for (var k in override) {
        if (!Object.prototype.hasOwnProperty.call(override, k)) continue;
        var ov = override[k];
        if (ov && typeof ov === 'object' && !Array.isArray(ov) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) {
          out[k] = window.__meowMerge(base[k], ov);
        } else {
          out[k] = ov;
        }
      }
      return out;
    };

    // A shared, permanent link (/g/<id>) 302-redirects here with
    // ?creation=<id>. Fetch the visitor's saved data BEFORE the app's
    // module script runs, so window.__MEOW_OVERRIDES__ is already in
    // place by the time the template's defaultData is first read.
    (function boot() {
      var creationId = new URLSearchParams(location.search).get('creation');
      function loadApp() {
        var m = document.createElement('script');
        m.type = 'module';
        m.crossOrigin = '';
        // ?v=2 busts any browser's cache from before this bundle was
        // patched (see git history) — it's served immutable/1yr-cached
        // since content-hashed filenames are supposed to never change
        // content, so a same-filename in-place patch needs an explicit
        // cache-bust or already-cached browsers keep the stale copy
        // forever. Bump this any time the bundle is patched again.
        m.src = '/assets/index-DgLINzUQ.js?v=2';
        document.head.appendChild(m);
      }
      if (creationId) {
        fetch('/api/public/lovearea-creation/' + encodeURIComponent(creationId))
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (creation) {
            if (creation && creation.slug && creation.data) {
              window.__MEOW_OVERRIDES__ = {};
              window.__MEOW_OVERRIDES__[creation.slug] = creation.data;
            }
          })
          .catch(function () {})
          .then(loadApp);
        return;
      }

      // A bare preview link (no ?creation=, e.g. the gallery's "Preview"
      // button) never goes through the customize form — without this,
      // it would show the bundle's original hardcoded text forever, even
      // after admin saves a master copy. Path is /template/<category>/
      // <design>; the slug is derived the same way it's built everywhere
      // else server-side (site-server.js's LOVEAREA_TEMPLATES mapping).
      var pathParts = location.pathname.split('/').filter(Boolean);
      var slug = pathParts[0] === 'template' && pathParts[1] && pathParts[2]
        ? ('love-' + pathParts[1] + '-' + pathParts[2]).toLowerCase().replace(/_/g, '-')
        : null;
      if (!slug) { loadApp(); return; }
      fetch('/api/public/lovearea-master/' + encodeURIComponent(slug))
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (master) {
          if (master && master.data) {
            window.__MEOW_OVERRIDES__ = {};
            window.__MEOW_OVERRIDES__[slug] = master.data;
          }
        })
        .catch(function () {})
        .then(loadApp);
    })();
  </script>
  <link rel="stylesheet" crossorigin href="/assets/index-xEid6EGe.css">
  <style>
    /* Hides this source app's own login/checkout upsell chrome — these
       templates are being served as part of Meow Webpages, not sold
       separately, so "Login to Edit", the WhatsApp help bubble, and the
       "Preview any design free / No account needed" footer bar don't
       apply here. CSS alone can't match by text content (no :contains()
       selector), so this pairs with the script below, which finds these
       specific elements by their actual text/href and hides them — with
       a MutationObserver keeping them hidden through this app's own
       client-side re-renders, the same self-healing approach already
       used for this site's Instagram credit badge. */

    /* Several templates' root section is a fixed h-screen (exactly
       100vh) that clips its own content, but on real phones the actual
       content is often taller than that — the overflow spills past the
       container and exposes the raw <body> background underneath, which
       is this app's own site-wide theme color (a pale blue), completely
       unrelated to whichever template is showing. Neutral white blends
       into every template's own pastel background far better than that
       mismatched blue block does. */
    body { background: #fff !important; }
  </style>
</head>

<body>
  <div id="root"></div>
  <script>
    (function () {
      function hideChrome() {
        // "Login to Edit" — top-right button; hide only this one button,
        // not its sibling flex row (which may also hold a genuinely
        // useful music on/off toggle for this template).
        document.querySelectorAll('button, a').forEach(function (el) {
          var t = (el.textContent || '').trim();
          if (t === 'Login to Edit') el.style.display = 'none';
        });

        // WhatsApp "Help" bubble and the adjacent "Preview any design
        // free / No account needed" text share one footer bar — hide
        // that whole bar.
        var help = document.querySelector('a[href*="wa.me"]');
        if (help) {
          var bar = help.closest('div');
          if (bar) bar.style.display = 'none';
          else help.style.display = 'none';
        }
      }
      hideChrome();
      document.addEventListener('DOMContentLoaded', hideChrome);
      new MutationObserver(hideChrome).observe(document.documentElement, { childList: true, subtree: true });
    })();
  </script>
</body>

</html>
